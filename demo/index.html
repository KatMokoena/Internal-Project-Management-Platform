<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project delivery</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: #0f1724;
      color: #e8eef5;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
    }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 2px 0 0; color: #9aabbd; font-size: 13px; }
    button {
      border: 0;
      border-radius: 8px;
      background: #e8eef5;
      color: #142033;
      font: inherit;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
    }
    img { width: 100%; height: auto; display: block; background: #101820; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Project delivery</h1>
      <p id="caption">Dashboard: 15 engagements, 4 at risk.</p>
    </div>
    <button type="button" id="replay">Replay</button>
  </header>
  <img id="shot" alt="Project dashboard with 15 engagements and 4 at risk" src="../screenshots/01-dashboard.png" />
  <script>
    const frames = [
      ["../screenshots/01-dashboard.png", "Dashboard: 15 engagements, 4 at risk.", "Project dashboard with 15 engagements and 4 at risk"],
      ["../screenshots/02-at-risk.png", "At risk filter: the overdue engagements stay on screen.", "At risk filter on the project dashboard"],
      ["../screenshots/03-timeline.png", "PRJ-2026-001 is at risk. The deadline has passed and tasks are still open.", "Order timeline marked at risk, with the critical step overdue"],
      ["../screenshots/04-critical.png", "Critical path: Pack and ship has no slack and is 138 days overdue.", "Critical path with Pack and ship 138 days overdue"],
      ["../screenshots/05-gantt.png", "Overview Gantt for the same engagements.", "Overview Gantt chart of the engagements"]
    ];
    const shot = document.getElementById("shot");
    const caption = document.getElementById("caption");
    let timers = [];
    function stop() {
      timers.forEach(clearTimeout);
      timers = [];
    }
    function show(index) {
      shot.src = frames[index][0];
      shot.alt = frames[index][2];
      caption.textContent = frames[index][1];
    }
    function play() {
      stop();
      show(0);
      frames.forEach(function (_, index) {
        if (index === 0) return;
        timers.push(setTimeout(function () { show(index); }, index * 1400));
      });
    }
    document.getElementById("replay").addEventListener("click", play);
    play();
  </script>
</body>
</html>
